<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      class Person {
        constructor(name) {
          this.name = name;
        }

        sayHello(name) {
          console.log(`Hello ${this.name}, nama saya ${name}`);
        }
      }

      const adrian = new Person("adrian");
      console.log(adrian);
      adrian.sayHello("shafiya");
    </script>
  </body>
</html>
