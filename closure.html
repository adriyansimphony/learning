<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //closure
      function createAdder(value) {
        const owner = "Adrian";
        function add(param) {
          console.info(owner);
          return value + param;
        }
        return add;
      }

      const add5 = createAdder(5);
      console.info(add5(10));

      const add10 = createAdder(10);
      console.info(add10(10));
    </script>
  </body>
</html>
