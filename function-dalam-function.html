<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function Dalam Function</title>
  </head>
  <body>
    <script>
      function outer() {
        function inner() {
          console.log("Inner");
        }

        inner();
        inner();
      }

      //harus panggil dulu function induknya agar muncul ke console
      outer();
      inner();
    </script>
  </body>
</html>
